name: Test cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal pom.xml for cache dependency path
        run: |
          mkdir -p hardened/tests/fixtures/maven
          cat > hardened/tests/fixtures/maven/pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'hardened/tests/fixtures/maven/pom.xml'
          cache-jdk: 'false'
          cache-path: '~/.m2/repository'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DISTRO: ${{ steps.setup-java.outputs.distribution }}
          CACHE_KEY: ${{ steps.setup-java.outputs.cache-primary-key }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DISTRO"
          echo "cache-primary-key: $CACHE_KEY"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DISTRO" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION ($DISTRO) installed with cache configuration"
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
