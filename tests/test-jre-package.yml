name: Test Java setup with JRE package type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jre'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert path output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: path '$ACTUAL' does not exist or is not a directory"
            exit 1
          fi
          echo "PASS: path=$ACTUAL"
      - name: Assert Java is installed and on PATH
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 JRE is installed"
