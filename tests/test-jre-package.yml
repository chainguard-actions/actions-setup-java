name: Test setup-java with JRE package type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jre'
      - name: Assert version output is set
        env:
          ACTUAL_VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL_VERSION'"
      - name: Assert distribution output is set
        env:
          ACTUAL_DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL_DIST"
          if [ -z "$ACTUAL_DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution output is '$ACTUAL_DIST'"
      - name: Assert java runtime is available
        run: |
          which java
          java -version
          echo "PASS: java runtime is available on PATH"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME '$JAVA_HOME' does not exist"
            exit 1
          fi
          echo "PASS: JAVA_HOME is '$JAVA_HOME'"
