name: Test setup-java with Zulu distribution Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Node.js 24 is available
        run: |
          NODE_VER=$(node --version 2>/dev/null || echo "v0.0.0")
          echo "Current node version: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 24 ]; then
            echo "Installing Node.js 24..."
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
          else
            echo "Node.js $NODE_VER is sufficient"
          fi

      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"

      - name: Assert version output contains 17
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "17"; then
            echo "FAIL: expected version containing '17' but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"

      - name: Assert JAVA_HOME is set and valid
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"

      - name: Assert java binary works
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is available"
