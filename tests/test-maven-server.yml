name: Test Maven server credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings path directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-username-env-var: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
          server-password-env-var: 'MY_PASSWORD'
          settings-path: '/tmp/maven-settings'
          overwrite-settings: 'true'
        env:
          MY_USERNAME: testuser
          MY_PASSWORD: testpassword
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION ($DIST) installed"
      - name: Assert settings.xml was created
        run: |
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml was not created at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "settings.xml content:"
          cat /tmp/maven-settings/settings.xml
          if ! grep -q "my-server" /tmp/maven-settings/settings.xml; then
            echo "FAIL: server-id 'my-server' not found in settings.xml"
            exit 1
          fi
          echo "PASS: settings.xml created with correct server-id"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java is on PATH"
