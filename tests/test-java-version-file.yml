name: Test Java setup using java-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .java-version file
        run: |
          echo "11" > .java-version
          cat .java-version
      - id: setup-java
        uses: .
        with:
          java-version-file: '.java-version'
          distribution: 'temurin'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert Java 11 is installed
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "11"; then
            echo "FAIL: expected Java 11 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 11 is installed"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
