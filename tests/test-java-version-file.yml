name: Test setup-java with java-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version-file: 'tests/fixtures/.java-version'
          distribution: 'temurin'
      - name: Assert version output contains 17
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "^17"; then
            echo "FAIL: expected version starting with 17, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java binary is on PATH and is version 17
        run: |
          java -version 2>&1
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "17"; then
            echo "FAIL: expected Java 17, got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 17 installed via .java-version file"
