name: Test setup-java with java-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .java-version file
        run: |
          echo "17" > "$GITHUB_WORKSPACE/.java-version"
          cat "$GITHUB_WORKSPACE/.java-version"
      - id: setup-java
        uses: .
        with:
          java-version-file: '.java-version'
          distribution: 'temurin'
      - name: Assert distribution output is set
        env:
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $DIST"
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$DIST"
      - name: Assert version output is set
        env:
          VER: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VER"
      - name: Assert Java 17 is installed
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java -version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '17'; then
            echo "FAIL: expected Java 17 from .java-version file but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 detected from .java-version file"
