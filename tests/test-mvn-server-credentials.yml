name: Test mvn-server-credentials and mvn-repositories inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings path directory
        run: mkdir -p /tmp/maven-settings-multi
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-server-credentials: |
            my-server:MY_SERVER_USERNAME:MY_SERVER_PASSWORD
          mvn-repositories: |
            my-repo:https://repo.example.com/maven2:false
          settings-path: '/tmp/maven-settings-multi'
        env:
          MY_SERVER_USERNAME: 'multiuser'
          MY_SERVER_PASSWORD: 'multipassword'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was created with multi-server config
        run: |
          if [ ! -f "/tmp/maven-settings-multi/settings.xml" ]; then
            echo "FAIL: settings.xml was not created"
            exit 1
          fi
          echo "settings.xml content:"
          cat /tmp/maven-settings-multi/settings.xml
          if ! grep -q "my-server" /tmp/maven-settings-multi/settings.xml; then
            echo "FAIL: settings.xml does not contain 'my-server'"
            exit 1
          fi
          echo "PASS: settings.xml created with mvn-server-credentials"
