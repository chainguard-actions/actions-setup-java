name: Test verify-signature-public-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch Adoptium GPG public key
        id: fetch-key
        run: |
          # Fetch the official Adoptium/Temurin GPG public key
          KEY=$(gpg --keyserver keyserver.ubuntu.com --recv-keys 3B04D753C9050D9A5D343F39843C48A565F8F04B 2>/dev/null && \
                gpg --armor --export 3B04D753C9050D9A5D343F39843C48A565F8F04B 2>/dev/null || echo "")
          if [ -n "$KEY" ]; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
            echo "key<<EOF" >> "$GITHUB_OUTPUT"
            echo "$KEY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            echo "key=" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'temurin'
          verify-signature: true
          verify-signature-public-key: ${{ steps.fetch-key.outputs.key }}
      - name: Assert action ran with verify-signature-public-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          KEY_FETCHED: ${{ steps.fetch-key.outputs.fetched }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "key_fetched: $KEY_FETCHED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with version=$VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (signature verification issue or key fetch failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
