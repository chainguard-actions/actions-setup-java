name: Test verify-signature-public-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # verify-signature-public-key replaces bundled keys; setting verify-signature: false
      # means the key is accepted but verification is not enforced (no fatal failure).
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          verify-signature: 'false'
          verify-signature-public-key: ''
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          echo "path: $JAVA_PATH"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          if [ -z "$JAVA_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
