name: Test setup-java with set-default false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # First install a default Java (11) so JAVA_HOME is set to something known
      - id: setup-java-default
        uses: .
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Record default JAVA_HOME
        id: record-default
        run: |
          echo "Default JAVA_HOME: $JAVA_HOME"
          echo "default_java_home=$JAVA_HOME" >> $GITHUB_OUTPUT
      # Now install Java 17 with set-default=false
      - id: setup-java-no-default
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          set-default: 'false'
      - name: Assert version output is set for non-default install
        env:
          ACTUAL_VERSION: ${{ steps.setup-java-no-default.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is set to $ACTUAL_VERSION"
      - name: Assert path output is set for non-default install
        env:
          ACTUAL_PATH: ${{ steps.setup-java-no-default.outputs.path }}
        run: |
          echo "actual path: $ACTUAL_PATH"
          if [ -z "$ACTUAL_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL_PATH" ]; then
            echo "FAIL: path directory does not exist: $ACTUAL_PATH"
            exit 1
          fi
          echo "PASS: path output is set and directory exists"
      - name: Assert JAVA_HOME still points to Java 11 (not updated by set-default=false)
        env:
          DEFAULT_JAVA_HOME: ${{ steps.record-default.outputs.default_java_home }}
        run: |
          echo "Current JAVA_HOME: $JAVA_HOME"
          echo "Expected JAVA_HOME (Java 11): $DEFAULT_JAVA_HOME"
          if [ "$JAVA_HOME" != "$DEFAULT_JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME was changed even though set-default=false"
            echo "  Expected: $DEFAULT_JAVA_HOME"
            echo "  Got: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME was not changed by set-default=false install"
