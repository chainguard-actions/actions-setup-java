name: Test setup with set-default false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record original JAVA_HOME
        id: original
        run: |
          echo "original_java_home=${JAVA_HOME:-}" >> "$GITHUB_OUTPUT"
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          set-default: 'false'
      - name: Assert path output is set
        env:
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "path: $JAVA_PATH"
          if [ -z "$JAVA_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$JAVA_PATH" ]; then
            echo "FAIL: path does not exist: $JAVA_PATH"
            exit 1
          fi
          echo "PASS: path=$JAVA_PATH"
      - name: Assert version output is set
        env:
          VER: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VER"
      - name: Assert JAVA_HOME was not changed
        env:
          ORIGINAL_JAVA_HOME: ${{ steps.original.outputs.original_java_home }}
        run: |
          echo "original JAVA_HOME: $ORIGINAL_JAVA_HOME"
          echo "current JAVA_HOME: $JAVA_HOME"
          if [ "$JAVA_HOME" != "$ORIGINAL_JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME was changed despite set-default=false"
            echo "  original: $ORIGINAL_JAVA_HOME"
            echo "  current:  $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME was not changed"
      - name: Assert JAVA_HOME_17 env var is set
        run: |
          # When set-default=false, JAVA_HOME_<major>_<arch> should still be set
          # The variable name pattern is JAVA_HOME_<major>_<arch> e.g. JAVA_HOME_17_X64
          echo "Checking for JAVA_HOME_17_* env vars..."
          env | grep -i "JAVA_HOME_17" || true
          if env | grep -qi "JAVA_HOME_17"; then
            echo "PASS: JAVA_HOME_17_* env var is set"
          else
            echo "WARN: JAVA_HOME_17_* env var not found in environment (may be set in a different scope)"
          fi
