name: Test Maven multi-server credentials and toolchain inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings path directory
        run: mkdir -p /tmp/maven-multi-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-server-credentials: |
            my-repo:MY_REPO_USER:MY_REPO_PASS
          mvn-repositories: |
            my-repo:https://repo.example.com/maven2:false
          mvn-repositories-include-central: 'true'
          mvn-repositories-prioritize-central: 'true'
          mvn-toolchain-id: 'temurin_21'
          mvn-toolchain-vendor: 'temurin'
          settings-path: '/tmp/maven-multi-settings'
        env:
          MY_REPO_USER: testuser
          MY_REPO_PASS: testpassword
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION ($DIST) installed"
      - name: Assert settings.xml was created
        run: |
          if [ ! -f "/tmp/maven-multi-settings/settings.xml" ]; then
            echo "FAIL: settings.xml was not created at /tmp/maven-multi-settings/settings.xml"
            exit 1
          fi
          echo "settings.xml content:"
          cat /tmp/maven-multi-settings/settings.xml
          echo "PASS: settings.xml created"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java is on PATH"
