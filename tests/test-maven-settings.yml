name: Test setup-java with Maven settings configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
        env:
          MY_USERNAME: testuser
          MY_PASSWORD: testpassword
      - name: Assert settings.xml was created
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS_FILE"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS_FILE"
            exit 1
          fi
          echo "PASS: settings.xml exists"
          cat "$SETTINGS_FILE"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          if ! grep -q "my-server" "$SETTINGS_FILE"; then
            echo "FAIL: settings.xml does not contain server-id 'my-server'"
            exit 1
          fi
          echo "PASS: settings.xml contains server-id 'my-server'"
      - name: Assert settings.xml contains username env var reference
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          if ! grep -q "MY_USERNAME" "$SETTINGS_FILE"; then
            echo "FAIL: settings.xml does not contain username env var 'MY_USERNAME'"
            exit 1
          fi
          echo "PASS: settings.xml contains username env var reference"
