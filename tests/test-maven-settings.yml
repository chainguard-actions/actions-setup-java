name: Test Java setup with Maven settings and toolchain options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          settings-path: '/tmp/maven-settings'
          mvn-toolchain-id: 'my-temurin-17'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was written to custom path
        run: |
          echo "Checking for settings.xml in /tmp/maven-settings"
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml not found at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "PASS"
