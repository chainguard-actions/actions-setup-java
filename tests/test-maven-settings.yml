name: Test setup-java with Maven settings configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
        env:
          MY_USERNAME: testuser
          MY_PASSWORD: testpassword
      - name: Assert version output is set
        env:
          ACTUAL_VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL_VERSION'"
      - name: Assert settings.xml was created
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS_FILE"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS_FILE"
            exit 1
          fi
          echo "settings.xml contents:"
          cat "$SETTINGS_FILE"
          echo "PASS: settings.xml exists"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          if ! grep -q 'my-server' "$SETTINGS_FILE"; then
            echo "FAIL: server-id 'my-server' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server-id 'my-server' found in settings.xml"
      - name: Assert java is available
        run: |
          which java
          java -version
          echo "PASS: java is available on PATH"
