name: Test Java setup with Maven settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username-env-var: 'MY_SERVER_USERNAME'
          server-password-env-var: 'MY_SERVER_PASSWORD'
          settings-path: '/tmp/maven-settings-test'
        env:
          MY_SERVER_USERNAME: 'testuser'
          MY_SERVER_PASSWORD: 'testpassword'
      - name: Assert version output
        env:
          VER: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VER"
      - name: Assert settings.xml was created
        run: |
          SETTINGS_FILE="/tmp/maven-settings-test/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS_FILE"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS_FILE"
            exit 1
          fi
          echo "PASS: settings.xml exists"
          cat "$SETTINGS_FILE"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS_FILE="/tmp/maven-settings-test/settings.xml"
          if grep -q "my-server" "$SETTINGS_FILE"; then
            echo "PASS: server-id 'my-server' found in settings.xml"
          else
            echo "FAIL: server-id 'my-server' not found in settings.xml"
            cat "$SETTINGS_FILE"
            exit 1
          fi
      - name: Assert java binary works
        run: |
          java -version
          echo "PASS: java -version succeeded"
