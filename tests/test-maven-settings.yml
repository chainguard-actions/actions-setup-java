name: Test setup-java Maven settings generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
      - name: Assert settings.xml was created
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists"
          cat "$SETTINGS"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          if ! grep -q 'my-server' "$SETTINGS"; then
            echo "FAIL: server-id 'my-server' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server-id found in settings.xml"
      - name: Assert settings.xml contains username env var reference
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          if ! grep -q 'MY_USERNAME' "$SETTINGS"; then
            echo "FAIL: server-username 'MY_USERNAME' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server-username found in settings.xml"
      - name: Assert settings.xml contains password env var reference
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          if ! grep -q 'MY_PASSWORD' "$SETTINGS"; then
            echo "FAIL: server-password 'MY_PASSWORD' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server-password found in settings.xml"
      - name: Assert Java is functional
        run: |
          java -version
          echo "PASS: java is functional"
