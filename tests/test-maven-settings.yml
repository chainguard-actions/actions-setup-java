name: Test settings-path, mvn-toolchain-id, and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          settings-path: '/tmp/maven-settings'
          mvn-toolchain-id: 'my-temurin-21'
          mvn-toolchain-vendor: 'eclipse'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was written to custom path
        run: |
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml not found at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "PASS: settings.xml found"
