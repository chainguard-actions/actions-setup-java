name: Test Java setup with Maven settings generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
      - name: Assert settings.xml was created
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS_FILE"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "FAIL: settings.xml was not created at $SETTINGS_FILE"
            exit 1
          fi
          echo "PASS: settings.xml exists"
          cat "$SETTINGS_FILE"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          if ! grep -q "my-server" "$SETTINGS_FILE"; then
            echo "FAIL: settings.xml does not contain server-id 'my-server'"
            cat "$SETTINGS_FILE"
            exit 1
          fi
          echo "PASS: settings.xml contains server-id 'my-server'"
      - name: Assert settings.xml contains server-username variable
        run: |
          SETTINGS_FILE="$HOME/.m2/settings.xml"
          if ! grep -q "MY_USERNAME" "$SETTINGS_FILE"; then
            echo "FAIL: settings.xml does not contain server-username 'MY_USERNAME'"
            cat "$SETTINGS_FILE"
            exit 1
          fi
          echo "PASS: settings.xml contains server-username reference"
      - name: Assert java is functional
        run: |
          java -version 2>&1
          echo "PASS: java command works"
