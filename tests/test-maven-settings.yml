name: Test Java setup with Maven settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create pom.xml for cache dependency path
        run: |
          cat > pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
      - name: Create custom settings path directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
          settings-path: '/tmp/maven-settings'
          mvn-toolchain-id: 'temurin_21'
          mvn-toolchain-vendor: 'temurin'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was created
        run: |
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: expected settings.xml to be created at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "PASS: settings.xml found"
