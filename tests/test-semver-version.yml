name: Test setup with semver version specification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert path output exists
        env:
          ACTUAL: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: path directory does not exist: $ACTUAL"
            exit 1
          fi
          echo "PASS: path=$ACTUAL"
      - name: Assert java is on PATH
        run: |
          which java
          java -version
          echo "PASS: java is available on PATH"
      - name: Assert Java version is 21
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q '21'; then
            echo "FAIL: expected Java 21 but got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 confirmed"
      - name: Assert javac is available
        run: |
          which javac
          javac -version
          echo "PASS: javac is available"
