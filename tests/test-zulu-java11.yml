name: Test setup-java with Zulu distribution and Java 11
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          distribution: zulu
          java-version: '11'
      - name: Assert distribution output is zulu
        env:
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $DIST"
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$DIST"
      - name: Assert version output contains 11
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$VERSION" | grep -q '^11'; then
            echo "FAIL: expected version starting with 11, got: $VERSION"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert java binary works
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '11'; then
            echo "FAIL: expected Java 11 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 11 is installed"
      - name: Assert javac is available
        run: |
          which javac
          javac -version
          echo "PASS: javac is available"
