name: Test setup with Zulu distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '11'
          distribution: 'zulu'
      - name: Assert distribution output
        env:
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $DIST"
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$DIST"
      - name: Assert version output
        env:
          VER: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VER"
      - name: Assert path output
        env:
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "path: $JAVA_PATH"
          if [ -z "$JAVA_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$JAVA_PATH" ]; then
            echo "FAIL: path does not exist: $JAVA_PATH"
            exit 1
          fi
          echo "PASS: path=$JAVA_PATH"
      - name: Assert java 11 is on PATH
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          if ! java -version 2>&1 | grep -q '11'; then
            echo "FAIL: expected Java 11"
            exit 1
          fi
          echo "PASS: java 11 is available"
      - name: Assert javac is available
        run: |
          which javac
          javac -version
          if ! javac -version 2>&1 | grep -q '11'; then
            echo "FAIL: expected javac 11"
            exit 1
          fi
          echo "PASS: javac 11 is available"
