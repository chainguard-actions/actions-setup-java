name: Test setup-java with check-latest option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          check-latest: true
      - name: Assert distribution output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output is set and starts with 17
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "^17"; then
            echo "FAIL: expected version starting with 17, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is functional
        run: |
          java -version
          javac -version
          echo "PASS: java and javac are functional"
