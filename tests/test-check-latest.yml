name: Test Java setup with check-latest option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          check-latest: true
      - name: Assert version output is set
        env:
          ACTUAL_VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is set to $ACTUAL_VERSION"
      - name: Assert java binary reports version 17
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version string: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is installed with check-latest"
      - name: Assert distribution output is set
        env:
          ACTUAL_DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL_DIST"
          if [ -z "$ACTUAL_DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution output is set to $ACTUAL_DIST"
