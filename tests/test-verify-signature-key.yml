name: Test setup-java with verify-signature-public-key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Node.js 24 is available
        run: |
          NODE_VER=$(node --version 2>/dev/null || echo "v0.0.0")
          echo "Current node version: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 24 ]; then
            echo "Installing Node.js 24..."
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
          else
            echo "Node.js $NODE_VER is sufficient"
          fi

      - name: Fetch Adoptium GPG public key
        id: fetch-key
        run: |
          # Fetch the official Adoptium/Temurin GPG public key used to sign releases
          # This is the well-known key from https://adoptium.net/installation/
          KEY=$(curl -fsSL "https://packages.adoptium.net/artifactory/api/security/keypair/default-gpg-key/public")
          echo "Fetched Adoptium public key"
          echo "key<<KEYDELIM" >> "$GITHUB_OUTPUT"
          echo "$KEY" >> "$GITHUB_OUTPUT"
          echo "KEYDELIM" >> "$GITHUB_OUTPUT"

      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          verify-signature: true
          verify-signature-public-key: ${{ steps.fetch-key.outputs.key }}

      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"

      - name: Assert path output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: path does not exist: $ACTUAL"
            exit 1
          fi
          echo "PASS: path=$ACTUAL"

      - name: Assert java is on PATH and correct version
        run: |
          which java
          java -version
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is on PATH with signature verification using custom public key"
