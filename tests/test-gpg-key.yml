name: Test gpg-private-key and gpg-passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test GPG key
        id: gen-gpg
        run: |
          # Install gpg if not present
          which gpg || apt-get install -y gnupg

          # Generate a test GPG key non-interactively
          cat > /tmp/gpg-batch.txt << 'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF

          gpg --batch --gen-key /tmp/gpg-batch.txt

          # Export the private key as base64
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG test@example.com 2>/dev/null | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          GPG_PRIVATE_KEY=$(gpg --armor --export-secret-keys "$KEY_ID" | base64 -w 0)
          echo "gpg_private_key=$GPG_PRIVATE_KEY" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ steps.gen-gpg.outputs.gpg_private_key }}
          gpg-passphrase: 'GPG_PASSPHRASE'
        env:
          GPG_PASSPHRASE: ''

      - name: Assert Java version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          PATH_OUT: ${{ steps.action.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed with GPG key, version=$VERSION"

      - name: Assert java binary works
        run: |
          java -version
          echo "PASS: java binary is functional"
