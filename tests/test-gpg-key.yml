name: Test gpg-private-key and gpg-passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate test GPG key
        id: gen-gpg
        run: |
          # Generate a test GPG key non-interactively
          gpg --batch --gen-key <<EOF
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          # Export the private key as base64
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG test@example.com | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          GPG_PRIVATE_KEY=$(gpg --armor --export-secret-keys "$KEY_ID")
          echo "gpg_private_key<<GPGEOF" >> $GITHUB_OUTPUT
          echo "$GPG_PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "GPGEOF" >> $GITHUB_OUTPUT
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ steps.gen-gpg.outputs.gpg_private_key }}
          gpg-passphrase: 'GPG_PASSPHRASE'
        env:
          GPG_PASSPHRASE: ''
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS"
