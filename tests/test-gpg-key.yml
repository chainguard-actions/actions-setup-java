name: Test gpg-private-key and gpg-passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test GPG key
        id: gen-gpg
        run: |
          # Generate a GPG key non-interactively for testing
          gpg --batch --gen-key <<EOF
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          # Export the private key
          GPG_KEY=$(gpg --armor --export-secret-keys test@example.com)
          echo "gpg_key<<GPGEOF" >> $GITHUB_OUTPUT
          echo "$GPG_KEY" >> $GITHUB_OUTPUT
          echo "GPGEOF" >> $GITHUB_OUTPUT
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ steps.gen-gpg.outputs.gpg_key }}
          gpg-passphrase: 'GPG_PASSPHRASE'
        env:
          GPG_PASSPHRASE: ''
      - name: Assert Java version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          PATH_OUT: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed with GPG key configured"
      - name: Assert java binary works
        run: |
          java -version
          echo "PASS: java binary is functional"
