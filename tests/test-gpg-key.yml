name: Test gpg-private-key and gpg-passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_GPG_PASSPHRASE: test-passphrase-123
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test GPG key
        id: gen-gpg
        run: |
          # Generate a GPG key non-interactively for testing
          cat > /tmp/gpg-batch.txt <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-batch.txt
          # Export the private key as ASCII armor
          GPG_KEY=$(gpg --armor --export-secret-keys test@example.com)
          echo "gpg_key<<EOF" >> $GITHUB_OUTPUT
          echo "$GPG_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          gpg-private-key: ${{ steps.gen-gpg.outputs.gpg_key }}
          gpg-passphrase: 'TEST_GPG_PASSPHRASE'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS"
