name: Test GPG private key import
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate throwaway GPG key
        id: gen
        run: |
          export GNUPGHOME="$(mktemp -d)"
          cat > /tmp/keyparams <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: Act Test
          Name-Email: act-test@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/keyparams
          FPR="$(gpg --batch --with-colons --list-secret-keys act-test@example.com | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "fpr=$FPR" >> "$GITHUB_OUTPUT"
          {
            echo "key<<GPGEOF"
            gpg --batch --armor --export-secret-keys "$FPR"
            echo "GPGEOF"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$GNUPGHOME"
      - id: action
        uses: .
        env:
          MY_GPG_PASSPHRASE: dummy-passphrase
        with:
          distribution: temurin
          java-version: '17'
          gpg-private-key: ${{ steps.gen.outputs.key }}
          gpg-passphrase: MY_GPG_PASSPHRASE
      - name: Assert key imported and settings written
        env:
          FPR: ${{ steps.gen.outputs.fpr }}
        run: |
          echo "fingerprint: $FPR"
          gpg --batch --list-secret-keys --with-colons | tee /tmp/keys.txt
          if ! grep -q "$FPR" /tmp/keys.txt; then echo "FAIL: key not imported"; exit 1; fi
          SETTINGS="$HOME/.m2/settings.xml"
          cat "$SETTINGS"
          if ! grep -q 'gpg.passphrase' "$SETTINGS"; then echo "FAIL: gpg.passphrase server missing"; exit 1; fi
          if ! grep -q 'MY_GPG_PASSPHRASE' "$SETTINGS"; then echo "FAIL: passphrase env name missing"; exit 1; fi
          echo "PASS"
