name: Test jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download a JDK archive for jdkFile input
        run: |
          # Download Temurin JDK 21 for Linux x64
          JDK_URL="https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_x64_linux_hotspot_21.0.5_11.tar.gz"
          mkdir -p /tmp/jdk-download
          curl -sfL "$JDK_URL" -o /tmp/jdk-download/jdk21.tar.gz
          echo "JDK_FILE=/tmp/jdk-download/jdk21.tar.gz" >> "$GITHUB_ENV"
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: '/tmp/jdk-download/jdk21.tar.gz'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java is available"
