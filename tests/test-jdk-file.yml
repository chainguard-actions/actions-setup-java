name: Test jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download a JDK archive for jdkFile test
        run: |
          # Download Temurin 21 JDK tarball for x64 Linux
          JDK_URL="https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"
          echo "Downloading JDK from Adoptium API..."
          curl -L -o /tmp/jdk-test.tar.gz "$JDK_URL"
          echo "Download complete, size: $(du -sh /tmp/jdk-test.tar.gz | cut -f1)"
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: '/tmp/jdk-test.tar.gz'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "path: $JAVA_PATH"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$JAVA_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION installed from jdkFile"
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
