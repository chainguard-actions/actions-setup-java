name: Test jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download a JDK archive for testing
        run: |
          # Download Temurin 21 JDK tarball for x64 Linux
          curl -fsSL -o /tmp/jdk21.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_x64_linux_hotspot_21.0.5_11.tar.gz"
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: '/tmp/jdk21.tar.gz'
          architecture: 'x64'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS"
