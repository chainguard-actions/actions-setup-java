name: Test Java setup from local JDK file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download JDK archive
        run: |
          # Download a small JDK tarball for testing
          curl -L -o /tmp/jdk.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_x64_linux_hotspot_21.0.5_11.tar.gz" \
            || {
              echo "Download failed, skipping test"
              exit 0
            }
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: '/tmp/jdk.tar.gz'
          architecture: 'x64'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS"
