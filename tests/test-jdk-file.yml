name: Test jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download a JDK archive for jdkFile test
        run: |
          # Download Temurin 17 JDK tarball to use as jdkFile input
          JDK_URL="https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse"
          echo "Downloading JDK from Adoptium API..."
          curl -L -o /tmp/jdk17.tar.gz "$JDK_URL"
          echo "Download complete, size: $(du -sh /tmp/jdk17.tar.gz | cut -f1)"
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'jdkfile'
          jdkFile: '/tmp/jdk17.tar.gz'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          PATH_OUT: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed from jdkFile, version=$VERSION"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java command works"
