name: Test basic Java setup with Temurin
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert path output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: path does not exist: $ACTUAL"
            exit 1
          fi
          echo "PASS: path=$ACTUAL"
      - name: Assert java is on PATH and correct version
        run: |
          echo "java version:"
          java -version
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is installed"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
