name: Test jdk-file and jdkFile inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake JDK archive for input coverage
        run: |
          # Create a minimal tar.gz to pass as jdk-file input
          mkdir -p /tmp/fake-jdk/bin
          echo '#!/bin/sh' > /tmp/fake-jdk/bin/java
          chmod +x /tmp/fake-jdk/bin/java
          tar -czf /tmp/fake-jdk.tar.gz -C /tmp fake-jdk
      - id: setup-java
        uses: .
        continue-on-error: true
        with:
          distribution: 'jdkfile'
          java-version: '21'
          jdk-file: '/tmp/fake-jdk.tar.gz'
          jdkFile: '/tmp/fake-jdk.tar.gz'
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.setup-java.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with jdk-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully with fake JDK archive (inputs were accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
