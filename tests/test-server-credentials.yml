name: Test server-username, server-password, and settings-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_SERVER_USERNAME'
          server-password: 'MY_SERVER_PASSWORD'
          settings-path: '/tmp/maven-settings'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DISTRO: ${{ steps.setup-java.outputs.distribution }}
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DISTRO"
          echo "path: $JAVA_PATH"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DISTRO" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION ($DISTRO) installed with server credentials"
      - name: Assert settings.xml was written to custom path
        run: |
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml not found at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "PASS: settings.xml found at custom path"
          cat /tmp/maven-settings/settings.xml
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
