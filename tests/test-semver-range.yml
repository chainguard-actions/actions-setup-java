name: Test setup-java with semver range version spec
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          distribution: temurin
          java-version: '17.0.x'
      - name: Assert distribution output is set
        env:
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $DIST"
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$DIST"
      - name: Assert version output matches 17.0.x pattern
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^17\.0\.[0-9]+'; then
            echo "FAIL: expected version matching 17.0.x pattern, got: $VERSION"
            exit 1
          fi
          echo "PASS: version=$VERSION matches 17.0.x"
      - name: Assert Java 17 is active
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '17'; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is installed"
      - name: Assert JAVA_HOME matches path output
        env:
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "path output: $JAVA_PATH"
          if [ "$JAVA_HOME" != "$JAVA_PATH" ]; then
            echo "FAIL: JAVA_HOME ($JAVA_HOME) does not match path output ($JAVA_PATH)"
            exit 1
          fi
          echo "PASS: JAVA_HOME matches path output"
