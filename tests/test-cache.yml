name: Test Java setup with Maven cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal pom.xml for cache-dependency-path
        run: |
          cat > /tmp/pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test</artifactId>
            <version>1.0</version>
          </project>
          EOF
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '/tmp/pom.xml'
      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert java is on PATH
        run: |
          java -version 2>&1
          echo "PASS"
