name: Test cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal pom.xml for cache dependency path
        run: |
          cat > /tmp/pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
          cp /tmp/pom.xml "$GITHUB_WORKSPACE/pom.xml"
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
          cache-jdk: 'true'
          cache-path: '~/.m2/repository'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          CACHE_HIT: ${{ steps.setup-java.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.setup-java.outputs.cache-primary-key }}
        run: |
          echo "version: $VERSION"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-primary-key: $CACHE_KEY"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: java installed with cache configuration"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
