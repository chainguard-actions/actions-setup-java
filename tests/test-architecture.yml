name: Test explicit architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          JPATH: ${{ steps.action.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "path: $JPATH"
          case "$VERSION" in
            17*) ;;
            *) echo "FAIL: version does not start with 17"; exit 1 ;;
          esac
          case "$JPATH" in
            *x64*) ;;
            *) echo "FAIL: path does not contain x64"; exit 1 ;;
          esac
          if [ ! -x "$JPATH/bin/java" ]; then echo "FAIL: java binary missing"; exit 1; fi
          echo "PASS"
