name: Test settings-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: mkdir -p /tmp/custom-maven-settings
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          settings-path: '/tmp/custom-maven-settings'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert settings.xml was written to custom path
        run: |
          if [ ! -f "/tmp/custom-maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml not found at custom path"
            exit 1
          fi
          echo "PASS: settings.xml found at custom path"
