name: Test settings-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: |
          mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          settings-path: '/tmp/maven-settings'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: Java installed with custom settings-path, version=$VERSION"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java command works"
      - name: Assert settings.xml was written to custom path
        run: |
          SETTINGS="/tmp/maven-settings/settings.xml"
          if [ -f "$SETTINGS" ]; then
            echo "settings.xml found at custom path:"
            cat "$SETTINGS"
            echo "PASS: settings.xml written to custom settings-path"
          else
            echo "FAIL: settings.xml not found at /tmp/maven-settings/settings.xml"
            exit 1
          fi
