name: Test settings-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: |
          mkdir -p /tmp/custom-maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          settings-path: '/tmp/custom-maven-settings'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert settings.xml was created at custom path
        run: |
          SETTINGS_FILE="/tmp/custom-maven-settings/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS_FILE"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "FAIL: settings.xml was not created at $SETTINGS_FILE"
            exit 1
          fi
          echo "settings.xml content:"
          cat "$SETTINGS_FILE"
          echo "PASS: settings.xml found at custom path"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
