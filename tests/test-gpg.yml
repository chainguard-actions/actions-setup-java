name: Test gpg-private-key and gpg-passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test GPG key and export it
        id: gen-gpg
        run: |
          # Generate a GPG key non-interactively for testing (no passphrase)
          cat > /tmp/gpg-batch.txt << 'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-batch.txt
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG test@example.com | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "Generated key ID: $GPG_KEY_ID"
          # Export the private key as ASCII armor and store in a file
          gpg --armor --export-secret-keys "$GPG_KEY_ID" > /tmp/test-gpg-key.asc
          echo "GPG key exported successfully"
          # Store key content as output (multiline)
          {
            echo 'gpg_key<<GPGEOF'
            cat /tmp/test-gpg-key.asc
            echo 'GPGEOF'
          } >> $GITHUB_OUTPUT
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          gpg-private-key: ${{ steps.gen-gpg.outputs.gpg_key }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSPHRASE: ''
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert GPG key was imported
        run: |
          # Verify the GPG key was imported into the keyring
          if gpg --list-secret-keys test@example.com 2>/dev/null | grep -q "test@example.com"; then
            echo "PASS: GPG key is present in keyring"
          else
            echo "FAIL: GPG key was not imported"
            exit 1
          fi
