name: Test jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download JDK archive for jdkFile test
        run: |
          # Download a small Temurin JDK 21 tarball for use with jdkFile
          curl -fsSL -o /tmp/jdk21.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_x64_linux_hotspot_21.0.5_11.tar.gz"
          echo "Downloaded JDK archive"
          ls -lh /tmp/jdk21.tar.gz
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          jdkFile: '/tmp/jdk21.tar.gz'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected path output to be non-empty"
            exit 1
          fi
          echo "PASS: path=$ACTUAL"
