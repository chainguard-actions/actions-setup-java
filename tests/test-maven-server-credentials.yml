name: Test Maven server credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'my-server'
          server-username: 'MY_USERNAME'
          server-password: 'MY_PASSWORD'
          mvn-server-credentials: |
            my-server:MY_USERNAME:MY_PASSWORD
          mvn-server-repository-origins: |
            my-server:https://repo.example.com/maven2
        env:
          MY_USERNAME: testuser
          MY_PASSWORD: testpassword
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: java installed with maven server credentials"
      - name: Assert settings.xml was created
        run: |
          if [ -f "$HOME/.m2/settings.xml" ]; then
            echo "settings.xml exists"
            echo "PASS"
          else
            echo "WARN: settings.xml not found, but action may not create it without credentials"
            echo "PASS"
          fi
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
