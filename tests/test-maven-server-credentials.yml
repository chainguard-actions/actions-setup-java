name: Test Maven server credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings path directory
        run: mkdir -p /tmp/maven-settings
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'my-repo'
          server-username-env-var: 'MY_MAVEN_USERNAME'
          server-password-env-var: 'MY_MAVEN_PASSWORD'
          settings-path: '/tmp/maven-settings'
        env:
          MY_MAVEN_USERNAME: 'testuser'
          MY_MAVEN_PASSWORD: 'testpassword'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was created
        run: |
          if [ ! -f "/tmp/maven-settings/settings.xml" ]; then
            echo "FAIL: settings.xml was not created at /tmp/maven-settings/settings.xml"
            exit 1
          fi
          echo "settings.xml content:"
          cat /tmp/maven-settings/settings.xml
          if ! grep -q "my-repo" /tmp/maven-settings/settings.xml; then
            echo "FAIL: settings.xml does not contain server-id 'my-repo'"
            exit 1
          fi
          echo "PASS: settings.xml created with correct server-id"
