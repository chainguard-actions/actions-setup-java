name: Test maven toolchains.xml custom id/vendor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: temurin
          java-version: '17'
          mvn-toolchain-id: my-custom-toolchain
          mvn-toolchain-vendor: my-vendor
      - name: Assert toolchains.xml content
        env:
          JPATH: ${{ steps.action.outputs.path }}
        run: |
          F="$HOME/.m2/toolchains.xml"
          if [ ! -f "$F" ]; then echo "FAIL: $F not found"; exit 1; fi
          cat "$F"
          grep -q 'my-custom-toolchain' "$F" || { echo "FAIL: toolchain id missing"; exit 1; }
          grep -q 'my-vendor' "$F" || { echo "FAIL: vendor missing"; exit 1; }
          grep -qF "$JPATH" "$F" || { echo "FAIL: jdkHome missing"; exit 1; }
          echo "PASS"
