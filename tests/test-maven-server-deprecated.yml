name: Test deprecated Maven server credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create settings path directory
        run: mkdir -p /tmp/maven-settings-deprecated
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'deprecated-repo'
          server-username: 'DEPRECATED_USERNAME_VAR'
          server-password: 'DEPRECATED_PASSWORD_VAR'
          settings-path: '/tmp/maven-settings-deprecated'
        env:
          DEPRECATED_USERNAME_VAR: 'depuser'
          DEPRECATED_PASSWORD_VAR: 'deppassword'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings.xml was created
        run: |
          if [ ! -f "/tmp/maven-settings-deprecated/settings.xml" ]; then
            echo "FAIL: settings.xml was not created"
            exit 1
          fi
          echo "settings.xml content:"
          cat /tmp/maven-settings-deprecated/settings.xml
          if ! grep -q "deprecated-repo" /tmp/maven-settings-deprecated/settings.xml; then
            echo "FAIL: settings.xml does not contain server-id 'deprecated-repo'"
            exit 1
          fi
          echo "PASS: settings.xml created with deprecated credential inputs"
