name: Test basic Java setup (Temurin, Java 21)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Assert distribution output
        env:
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "distribution: $DIST"
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$DIST"
      - name: Assert version output
        env:
          VER: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VER"
          if [ -z "$VER" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VER"
      - name: Assert path output
        env:
          JPATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "path: $JPATH"
          if [ -z "$JPATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$JPATH" ]; then
            echo "FAIL: JAVA_HOME path does not exist: $JPATH"
            exit 1
          fi
          echo "PASS: path=$JPATH"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS"
      - name: Assert java binary works
        run: |
          java -version
          if [ $? -ne 0 ]; then
            echo "FAIL: java -version failed"
            exit 1
          fi
          echo "PASS"
      - name: Assert Java 21 major version
        run: |
          VER=$(java -version 2>&1 | head -1)
          echo "java version output: $VER"
          if echo "$VER" | grep -qE '"21(\.|")'; then
            echo "PASS: Java 21 confirmed"
          else
            echo "FAIL: expected Java 21, got: $VER"
            exit 1
          fi
