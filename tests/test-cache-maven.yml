name: Test cache input (maven)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Assert Java version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          PATH_OUT: ${{ steps.action.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed with cache=maven, version=$VERSION"
      - name: Assert java binary works
        run: |
          java -version
          echo "PASS: java binary is functional"
