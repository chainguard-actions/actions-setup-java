name: Test cache input (maven)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal pom.xml for cache detection
        run: |
          cat > pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION installed with maven cache enabled"
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
