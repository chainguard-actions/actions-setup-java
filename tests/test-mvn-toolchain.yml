name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-17'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert distribution output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected distribution output to be non-empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert Maven toolchains.xml was created with custom id and vendor
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking for toolchains.xml at: $TOOLCHAINS_FILE"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml was not created at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if grep -q "my-temurin-17" "$TOOLCHAINS_FILE"; then
            echo "PASS: custom toolchain id 'my-temurin-17' found in toolchains.xml"
          else
            echo "FAIL: custom toolchain id 'my-temurin-17' not found in toolchains.xml"
            exit 1
          fi
          if grep -q "adoptium" "$TOOLCHAINS_FILE"; then
            echo "PASS: custom toolchain vendor 'adoptium' found in toolchains.xml"
          else
            echo "FAIL: custom toolchain vendor 'adoptium' not found in toolchains.xml"
            exit 1
          fi
