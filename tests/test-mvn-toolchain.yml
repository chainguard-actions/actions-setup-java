name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-17'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert Java version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          PATH_OUT: ${{ steps.setup-java.outputs.path }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed with custom Maven toolchain id and vendor"
      - name: Assert java binary works
        run: |
          java -version
          echo "PASS: java binary is functional"
      - name: Assert Maven toolchains.xml was written with custom id and vendor
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-temurin-17" "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom toolchain id 'my-temurin-17' not found in toolchains.xml"
            exit 1
          fi
          if ! grep -q "adoptium" "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom toolchain vendor 'adoptium' not found in toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml contains custom id and vendor"
