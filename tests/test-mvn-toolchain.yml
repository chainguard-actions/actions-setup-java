name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-21'
          mvn-toolchain-vendor: 'eclipse'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION installed with custom toolchain id/vendor"
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
      - name: Assert Maven toolchains.xml was created with custom id and vendor
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking for toolchains.xml at: $TOOLCHAINS_FILE"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q 'my-temurin-21' "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom toolchain id 'my-temurin-21' not found in toolchains.xml"
            exit 1
          fi
          if ! grep -q 'eclipse' "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom toolchain vendor 'eclipse' not found in toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml contains custom id and vendor"
