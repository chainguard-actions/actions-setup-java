name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-17'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: Java installed with custom toolchain id/vendor, version=$VERSION"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java command works"
      - name: Assert Maven toolchains.xml was created
        run: |
          TOOLCHAINS="$HOME/.m2/toolchains.xml"
          if [ -f "$TOOLCHAINS" ]; then
            echo "toolchains.xml contents:"
            cat "$TOOLCHAINS"
            if grep -q "my-temurin-17" "$TOOLCHAINS"; then
              echo "PASS: custom toolchain-id found in toolchains.xml"
            else
              echo "FAIL: custom toolchain-id 'my-temurin-17' not found in toolchains.xml"
              exit 1
            fi
          else
            echo "INFO: toolchains.xml not created (may be expected if no Maven present)"
          fi
