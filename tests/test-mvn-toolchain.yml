name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-custom-toolchain-id'
          mvn-toolchain-vendor: 'my-custom-vendor'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert distribution output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected distribution output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert toolchains.xml contains custom toolchain id
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking toolchains.xml at $TOOLCHAINS_FILE"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "Contents of toolchains.xml:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-custom-toolchain-id" "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom toolchain id 'my-custom-toolchain-id' not found in toolchains.xml"
            exit 1
          fi
          if ! grep -q "my-custom-vendor" "$TOOLCHAINS_FILE"; then
            echo "FAIL: custom vendor 'my-custom-vendor' not found in toolchains.xml"
            exit 1
          fi
          echo "PASS: custom toolchain id and vendor found in toolchains.xml"
