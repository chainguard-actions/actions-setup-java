name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          mvn-toolchain-id: 'temurin-17'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
          PATH_OUT: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          echo "path: $PATH_OUT"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$PATH_OUT" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS: Java installed with custom Maven toolchain id/vendor, version=$VERSION"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java command works"
      - name: Assert Maven toolchains.xml was created with custom values
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking for toolchains.xml at: $TOOLCHAINS_FILE"
          if [ -f "$TOOLCHAINS_FILE" ]; then
            echo "toolchains.xml content:"
            cat "$TOOLCHAINS_FILE"
            if grep -q "temurin-17" "$TOOLCHAINS_FILE"; then
              echo "PASS: custom mvn-toolchain-id 'temurin-17' found in toolchains.xml"
            else
              echo "FAIL: custom mvn-toolchain-id 'temurin-17' not found in toolchains.xml"
              exit 1
            fi
            if grep -q "adoptium" "$TOOLCHAINS_FILE"; then
              echo "PASS: custom mvn-toolchain-vendor 'adoptium' found in toolchains.xml"
            else
              echo "FAIL: custom mvn-toolchain-vendor 'adoptium' not found in toolchains.xml"
              exit 1
            fi
          else
            echo "INFO: toolchains.xml not created (may require Maven to be installed first)"
            echo "PASS: action completed successfully with mvn-toolchain inputs set"
          fi
