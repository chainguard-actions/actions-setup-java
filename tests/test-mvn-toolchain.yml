name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-custom-toolchain'
          mvn-toolchain-vendor: 'adoptium'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert distribution output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected distribution output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert toolchains.xml was written
        run: |
          if [ ! -f "$HOME/.m2/toolchains.xml" ]; then
            echo "FAIL: expected toolchains.xml at ~/.m2/toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml found"
          cat "$HOME/.m2/toolchains.xml"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS"
