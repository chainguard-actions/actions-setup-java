name: Test Maven toolchain inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-21'
          mvn-toolchain-vendor: 'Eclipse Temurin'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
          JAVA_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          echo "path: $JAVA_PATH"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          if [ -z "$JAVA_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert toolchains.xml was created
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml was not created at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-temurin-21" "$TOOLCHAINS_FILE"; then
            echo "FAIL: toolchains.xml does not contain toolchain id 'my-temurin-21'"
            exit 1
          fi
          echo "PASS: toolchains.xml created with custom toolchain id"
