name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-custom-toolchain'
          mvn-toolchain-vendor: 'eclipse'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert toolchains.xml was created with custom values
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-custom-toolchain" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected 'my-custom-toolchain' in toolchains.xml"
            exit 1
          fi
          if ! grep -q "eclipse" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected 'eclipse' vendor in toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml contains expected custom values"
