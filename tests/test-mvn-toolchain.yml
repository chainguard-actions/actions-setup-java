name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-21'
          mvn-toolchain-vendor: 'eclipse'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is on PATH
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert toolchains.xml was written with custom id and vendor
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking for toolchains.xml at: $TOOLCHAINS_FILE"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml contents:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-temurin-21" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected mvn-toolchain-id 'my-temurin-21' not found in toolchains.xml"
            exit 1
          fi
          if ! grep -q "eclipse" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected mvn-toolchain-vendor 'eclipse' not found in toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml contains expected id and vendor"
