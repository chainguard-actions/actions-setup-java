name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-custom-toolchain-id'
          mvn-toolchain-vendor: 'my-custom-vendor'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          DIST: ${{ steps.action.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: version=$VERSION distribution=$DIST"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert Maven toolchains.xml was created with custom values
        run: |
          TOOLCHAINS_FILE="$HOME/.m2/toolchains.xml"
          echo "Checking for toolchains.xml at: $TOOLCHAINS_FILE"
          if [ ! -f "$TOOLCHAINS_FILE" ]; then
            echo "FAIL: toolchains.xml not found at $TOOLCHAINS_FILE"
            exit 1
          fi
          echo "toolchains.xml content:"
          cat "$TOOLCHAINS_FILE"
          if ! grep -q "my-custom-toolchain-id" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected custom toolchain ID 'my-custom-toolchain-id' in toolchains.xml"
            exit 1
          fi
          if ! grep -q "my-custom-vendor" "$TOOLCHAINS_FILE"; then
            echo "FAIL: expected custom vendor 'my-custom-vendor' in toolchains.xml"
            exit 1
          fi
          echo "PASS: toolchains.xml contains custom toolchain ID and vendor"
