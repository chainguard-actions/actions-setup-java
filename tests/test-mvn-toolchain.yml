name: Test mvn-toolchain-id and mvn-toolchain-vendor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-toolchain-id: 'my-temurin-21'
          mvn-toolchain-vendor: 'eclipse'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
      - name: Assert Maven toolchains.xml was created
        run: |
          if [ -f "$HOME/.m2/toolchains.xml" ]; then
            echo "toolchains.xml content:"
            cat "$HOME/.m2/toolchains.xml"
            if grep -q "my-temurin-21" "$HOME/.m2/toolchains.xml"; then
              echo "PASS: mvn-toolchain-id found in toolchains.xml"
            else
              echo "FAIL: mvn-toolchain-id not found in toolchains.xml"
              exit 1
            fi
          else
            echo "INFO: toolchains.xml not created (may be expected if no Maven present)"
          fi
