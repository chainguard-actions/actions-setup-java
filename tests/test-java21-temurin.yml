name: Test Java 21 setup with Temurin
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Assert version output contains 21
        env:
          ACTUAL_VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL_VERSION" | grep -q "21"; then
            echo "FAIL: expected version to contain '21', got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: version output contains 21"
      - name: Assert java binary reports version 21
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version string: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is installed"
      - name: Assert path output points to valid directory
        env:
          ACTUAL_PATH: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "actual path: $ACTUAL_PATH"
          if [ -z "$ACTUAL_PATH" ]; then
            echo "FAIL: path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL_PATH" ]; then
            echo "FAIL: path directory does not exist: $ACTUAL_PATH"
            exit 1
          fi
          echo "PASS: path output is valid"
