name: Test setup-java with Java 21 temurin distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Assert version output contains 21
        env:
          ACTUAL_VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          # Check that the version starts with 21
          if [[ "$ACTUAL_VERSION" != 21* ]]; then
            echo "FAIL: expected version to start with '21', got '$ACTUAL_VERSION'"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL_VERSION'"
      - name: Assert java binary works
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version string: $JAVA_VER"
          echo "PASS: java binary is functional"
      - name: Assert JAVA_HOME points to Java 21
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          RELEASE_FILE="$JAVA_HOME/release"
          if [ ! -f "$RELEASE_FILE" ]; then
            echo "FAIL: release file not found at $RELEASE_FILE"
            exit 1
          fi
          echo "Release file contents:"
          cat "$RELEASE_FILE"
          if ! grep -q 'JAVA_VERSION="21' "$RELEASE_FILE"; then
            echo "FAIL: expected Java 21 in release file"
            exit 1
          fi
          echo "PASS: JAVA_HOME points to Java 21"
