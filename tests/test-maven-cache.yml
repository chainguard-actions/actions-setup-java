name: Test setup-java with Maven cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Node.js 24 is available
        run: |
          NODE_VER=$(node --version 2>/dev/null || echo "v0.0.0")
          echo "Current node version: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 24 ]; then
            echo "Installing Node.js 24..."
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
          else
            echo "Node.js $NODE_VER is sufficient"
          fi

      - name: Create a minimal pom.xml for cache detection
        run: |
          cat > "$GITHUB_WORKSPACE/pom.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>test-project</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
          echo "Created pom.xml"
          cat "$GITHUB_WORKSPACE/pom.xml"

      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Assert distribution output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"

      - name: Assert cache-primary-key output (lenient - may be empty if cache service unavailable)
        env:
          ACTUAL: ${{ steps.setup-java.outputs.cache-primary-key }}
        run: |
          echo "actual cache-primary-key: $ACTUAL"
          # cache-primary-key may be empty if the cache service is unavailable under act
          # We just log it without failing
          if [ -n "$ACTUAL" ]; then
            echo "PASS: cache-primary-key=$ACTUAL"
          else
            echo "INFO: cache-primary-key is empty (cache service may be unavailable)"
          fi

      - name: Assert java is available
        run: |
          java -version
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is available with Maven cache configured"
