name: Test setup-java with custom settings-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: mkdir -p /tmp/custom-m2
      - id: setup-java
        uses: .
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'central'
          settings-path: '/tmp/custom-m2'
      - name: Assert settings.xml was created at custom path
        run: |
          SETTINGS="/tmp/custom-m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at custom path $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists at custom path"
          cat "$SETTINGS"
      - name: Assert settings.xml contains server-id
        run: |
          SETTINGS="/tmp/custom-m2/settings.xml"
          if ! grep -q 'central' "$SETTINGS"; then
            echo "FAIL: server-id 'central' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server-id 'central' found in settings.xml"
      - name: Assert Java is functional
        run: |
          java -version
          echo "PASS: java is functional"
