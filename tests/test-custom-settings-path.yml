name: Test setup-java with custom Maven settings path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom settings directory
        run: mkdir -p /tmp/custom-m2
      - id: setup-java
        uses: .
        with:
          distribution: temurin
          java-version: '17'
          settings-path: '/tmp/custom-m2'
      - name: Assert settings.xml was created in custom path
        run: |
          SETTINGS="/tmp/custom-m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists at custom path"
          cat "$SETTINGS"
      - name: Assert Java is installed
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
