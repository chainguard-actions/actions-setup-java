name: Test Maven repositories and server credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'temurin'
          mvn-server-credentials: |
            my-server:MY_USERNAME:MY_PASSWORD
          mvn-repositories: |
            my-repo:https://repo.example.com/maven2:false
          mvn-repositories-include-central: 'true'
          mvn-repositories-prioritize-central: 'true'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-java.outputs.version }}
          DIST: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "version: $VERSION"
          echo "distribution: $DIST"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$DIST" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: Java $VERSION ($DIST) installed with Maven repository inputs"
      - name: Assert java is executable
        run: |
          java -version
          echo "PASS: java is on PATH"
