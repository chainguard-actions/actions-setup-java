name: Test setup-java with Zulu distribution and Java 21
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-java
        uses: .
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Assert distribution output is zulu
        env:
          ACTUAL: ${{ steps.setup-java.outputs.distribution }}
        run: |
          echo "actual distribution: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: distribution output is empty"
            exit 1
          fi
          echo "PASS: distribution=$ACTUAL"
      - name: Assert version output contains 21
        env:
          ACTUAL: ${{ steps.setup-java.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "^21"; then
            echo "FAIL: expected version starting with 21, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert java version is 21
        run: |
          java -version 2>&1
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21, got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 is installed"
